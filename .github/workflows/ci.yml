name: Pocket Ledger CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Tests
        run: mvn clean verify site

      - name: Set Environment Var for DB
        run: |
          echo "POSTGRES_USER=testuser" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD=testpass" >> $GITHUB_ENV
          echo "POSTGRES_DB=testdb" >> $GITHUB_ENV

      - name: Build Docker Image
        run: docker build -t pocket-ledger .

      - name: Start Containers
        run: |
          docker compose up -d
          sleep 30
          docker compose logs

      - name: Stop Containers
        if: always()
        run: docker compose down

      - name: Upload JUnit Test Results
        if: always()
        uses: actions/upload-artifact@v4 # Updated to v4
        with:
          name: junit-reports
          path: target/surefire-reports/*.xml

      - name: Upload HTML Test Reports
        if: always()
        uses: actions/upload-artifact@v4 # Updated to v4
        with:
          name: html-test-reports
          path: target/site/**/*



